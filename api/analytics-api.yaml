openapi: 3.0.0
info:
  title: Analytics API
  description: Business intelligence endpoints for the e-commerce platform, providing insights into orders, revenue, and customer behavior.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api

paths:

  /analytics/orders/count:
    get:
      summary: Get the total number of orders
      description: Returns the total count of all orders ever created on the platform.
      responses:
        '200':
          description: Total order count retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOrders:
                    type: integer
                    example: 1287
        '500':
          description: Internal server error

  /analytics/orders/count-by-type:
    get:
      summary: Get the number of orders per item type
      description: Returns how many orders were placed for each item type (e.g., cakes, books, clothing).
      responses:
        '200':
          description: Order counts by item type retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  countsByType:
                    type: array
                    items:
                      type: object
                      properties:
                        itemType:
                          type: string
                          example: "Cake"
                        orderCount:
                          type: integer
                          example: 432
        '500':
          description: Internal server error

  /analytics/revenue:
    get:
      summary: Get the total revenue
      description: Returns the total revenue generated from all orders.
      responses:
        '200':
          description: Total revenue retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRevenue:
                    type: number
                    format: float
                    example: 458920.50
                  currency:
                    type: string
                    example: "USD"
        '500':
          description: Internal server error

  /analytics/revenue/by-type:
    get:
      summary: Get revenue broken down by item type
      description: Returns the total revenue generated by each item type.
      responses:
        '200':
          description: Revenue breakdown by item type retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: string
                    example: "USD"
                  revenueByType:
                    type: array
                    items:
                      type: object
                      properties:
                        itemType:
                          type: string
                          example: "Cake"
                        revenue:
                          type: number
                          format: float
                          example: 210430.00
        '500':
          description: Internal server error

  /analytics/customers/top-spenders:
    get:
      summary: Get the top-spending customers
      description: Returns a ranked list of customers who have spent the most, useful for identifying VIP customers.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many top customers to return (defaults to 10).
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Top spenders retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: string
                    example: "USD"
                  topSpenders:
                    type: array
                    items:
                      type: object
                      properties:
                        customerId:
                          type: string
                          example: "C-1024"
                        customerName:
                          type: string
                          example: "Jane Smith"
                        totalSpent:
                          type: number
                          format: float
                          example: 8450.75
                        orderCount:
                          type: integer
                          example: 23
        '500':
          description: Internal server error

  /analytics/customers/new-vs-returning:
    get:
      summary: Get the breakdown of new vs returning customers
      description: Returns how many customers are new versus returning within an optional date range, useful for measuring customer retention.
      parameters:
        - name: startDate
          in: query
          required: false
          description: Start of the date range (YYYY-MM-DD).
          schema:
            type: string
            example: "2026-01-01"
        - name: endDate
          in: query
          required: false
          description: End of the date range (YYYY-MM-DD).
          schema:
            type: string
            example: "2026-01-31"
      responses:
        '200':
          description: New vs returning breakdown retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  newCustomers:
                    type: integer
                    example: 340
                  returningCustomers:
                    type: integer
                    example: 912
                  totalCustomers:
                    type: integer
                    example: 1252
        '400':
          description: Invalid date range provided
        '500':
          description: Internal server error